<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Matches the PHP app's favicon (templates/header.php) -->
    <link rel="shortcut icon" href="/images/lirs-logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCMS - Courier & Correspondence Management</title>

    <!-- Same font + icon CDNs as the PHP app (templates/header.php), so
         type and iconography render identically. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Anti-flash: sets data-theme before app.css loads/React mounts,
         same purpose and logic as the PHP app's templates/theme-init.php.
         Must stay inline (not a linked file) or the flash it prevents
         would just move to before this script itself loads. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ccmts-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', stored || (prefersDark ? 'dark' : 'light'));
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
